<!DOCTYPE html>
<!--
    AuScope — AusPass Seismic Network map (presentation artefact)

    A standalone 16:9 display page carrying ONLY the station map. It is a
    deliberate, self-contained duplicate of the map inside
    auspass.html#station-map-panel: same single FDSN fetch, same
    deployment-identity keying, same equal-ground-distance projection, same
    palette, legend and tooltip. Nothing is imported from the tracker pages so
    the file can be opened, projected or embedded on its own.

    TARGET SIZE: 1145 x 644. That is the Squarespace content column at its
    max-width, which is where this page is embedded. Type and spacing are
    judged at that size — NOT at 1920 x 1080. The page still scales cleanly to
    a full-screen 1920 x 1080 because every length is expressed in one `--u`
    unit (1% of the stage width), so the layout is a pure scale at any
    resolution and can never produce a scrollbar.

    Differences from the tracker's map, all deliberate:
      * Australia only — the "All deployments" mode is gone.
      * No navigation, no outbound links: this is a display artefact.

    Data:  https://auspass.edu.au/fdsnws/station/1/query  (station + network)
    Coast: australia-outline.json  (sibling file)
    Logos: assets/auscope-logo.png, assets/auspass-logo.png
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AusPass Seismic Network — AuScope</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ============================================================
   TOKENS
   Palette copied from tracker-shared.css so the page matches the
   family without linking to it.
   ============================================================ */
:root {
    --bg: #ffffff;
    --bg-soft: #f8fafc;
    --bg-muted: #f1f5f9;
    --border: #e5e7eb;
    --border-strong: #cbd5e1;
    --text: #0f172a;
    --text-soft: #475569;
    --text-muted: #94a3b8;
    --accent: #2563eb;
    --accent-soft: #dbeafe;
    --accent-bg: #eff6ff;
    --bad: #dc2626;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Geneva, sans-serif;
    --mono: 'SFMono-Regular', 'Menlo', 'Cascadia Mono', 'Consolas', monospace;

    /* ONE unit drives the entire page: 1u = 1% of the stage's width.
       The live embed on auscope.org.au is 513px wide, so 1u = 5.13px — that is
       the number to hold in mind when reading every multiple below, and it is
       why the type multiples here look large next to a full-screen design. A
       body size of 1u would render at 5px in the iframe. The stage is always
       16:9, so the page is the same drawing at any resolution, which is what
       makes "no scrollbars, nothing clipped" a property of the layout rather
       than something to re-test per screen. */
    --u: calc(min(100vw, 177.7778vh) / 100);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
    height: 100%;
    overflow: hidden;              /* a display artefact never scrolls */
}

body {
    font-family: var(--sans);
    color: var(--text);
    /* Letterbox colour for off-ratio screens and projectors. */
    background: #0f172a;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
}

/* ---------- the 16:9 stage ---------- */
.stage {
    width: calc(var(--u) * 100);
    /* Grows into whatever height the frame actually gives it, capped at 70u.
       The live embed is 513x335 (1.53:1) while a bare 16:9 stage is 1.78:1, so
       a fixed 56.25u letterboxed away 46px — 14% of the iframe — and that lost
       height was being paid for in legend rows and type size. At 16:9 the min
       still resolves to 56.25u, so the original proportions are unchanged
       where the page is shown full-bleed. */
    height: min(100vh, calc(var(--u) * 70));
    background: var(--bg);
    /* Side padding is deliberately half the top/bottom: at 513px wide every
       unit of horizontal margin comes straight off the map and the legend,
       which are both already tight. */
    padding: calc(var(--u) * 1.5) calc(var(--u) * 0.9) calc(var(--u) * 1.2);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* ---------- title strip ---------- */
.title-strip {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: calc(var(--u) * 2);
    padding-bottom: calc(var(--u) * 0.7);
    border-bottom: 1px solid var(--border);
    margin-bottom: calc(var(--u) * 1.0);
    flex-shrink: 0;
}
.title-strip h1 {
    font-size: calc(var(--u) * 3.0);
    font-weight: 600;
    letter-spacing: -0.015em;
    line-height: 1.15;
}
.title-strip h1 .accent { color: var(--accent); font-weight: 700; }
.title-strip .sub {
    font-size: calc(var(--u) * 1.02);
    line-height: 1.4;
    color: var(--text-muted);
    margin-top: calc(var(--u) * 0.22);
    letter-spacing: 0.01em;
}
.counts {
    text-align: right;
    flex-shrink: 0;
}
.counts .primary {
    font-size: calc(var(--u) * 2.2);
    font-weight: 600;
    line-height: 1.2;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    white-space: nowrap;
}

/* ---------- main split ---------- */
.frame {
    flex: 1;
    min-height: 0;
    display: flex;
    gap: calc(var(--u) * 1.4);
}
.map-pane {
    flex: 1;
    min-width: 0;
    position: relative;
    display: flex;
}
#map-svg {
    width: 100%;
    height: 100%;
    display: block;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: calc(var(--u) * 0.35);
}
#map-status {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: calc(var(--u) * 2);
    font-size: calc(var(--u) * 1.1);
    color: var(--text-soft);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: calc(var(--u) * 0.35);
}
#map-status[hidden] { display: none; }
#map-status.error { color: var(--bad); }

/* ---------- map internals ---------- */
#map-coast path {
    fill: var(--bg-muted);
    stroke: var(--border-strong);
    stroke-width: 1.4;
    stroke-linejoin: round;
}
#map-svg circle.stn { fill-opacity: 0.72; }
/* Dimmed to a flat neutral rather than a faint tint of their own colour:
   nodal arrays stack hundreds of dots on the same few pixels and faint
   colour re-accumulates into strong colour that competes with the
   deployment actually selected. id + two classes beats the .n0–.n19 fills. */
#map-svg circle.stn.dim { fill: #94a3b8; fill-opacity: 0.15; }
/* Full strength: these are the only attribution on the page, and at a
   513px embed an 0.85 wordmark reads as a rendering fault rather than as
   restraint. */
#map-brand image { opacity: 1; }

/* ---------- locator inset ----------
   Only appears when a deployment is zoomed far enough that the coast has left
   the frame. Vulcan's array spans 9 km; at that scale the map answers "what
   shape is it" perfectly and "where in Australia" not at all, and the inset
   is what puts the second answer back. */
#map-inset .in-plate { fill: #ffffff; fill-opacity: 0.92; stroke: var(--border-strong); stroke-width: 1.2; }
#map-inset .in-coast { fill: #eef2f7; stroke: #cbd5e1; stroke-width: 1.2; }
#map-inset .in-mark { fill: #dc2626; stroke: #ffffff; stroke-width: 1.6; }
#map-inset .in-ring { fill: none; stroke: #dc2626; stroke-width: 1.8; opacity: 0.55; }
#map-brand #brand-plate { fill: #ffffff; fill-opacity: 0.78; }

/* Deployment palette — 20 flat hues, repeated across the 73 deployments
   drawn here. AuScope purple first; amber and red are deliberately absent.
   Built as families with clear lightness steps rather than 20 evenly spaced
   hues: skipping the red-to-amber arc leaves too little hue space for 20 to
   separate on hue alone. Keep in sync with NET_PALETTE below. */
#map-svg circle.n0  { fill: #282572; }  /* deep indigo (AuScope) */
#map-svg circle.n1  { fill: #4338ca; }  /* indigo         */
#map-svg circle.n2  { fill: #2563eb; }  /* blue           */
#map-svg circle.n3  { fill: #60a5fa; }  /* sky            */
#map-svg circle.n4  { fill: #155e75; }  /* deep cyan      */
#map-svg circle.n5  { fill: #0891b2; }  /* cyan           */
#map-svg circle.n6  { fill: #0d9488; }  /* teal           */
#map-svg circle.n7  { fill: #065f46; }  /* pine           */
#map-svg circle.n8  { fill: #166534; }  /* forest         */
#map-svg circle.n9  { fill: #16a34a; }  /* green          */
#map-svg circle.n10 { fill: #4d7c0f; }  /* olive          */
#map-svg circle.n11 { fill: #84cc16; }  /* lime           */
#map-svg circle.n12 { fill: #5b21b6; }  /* deep violet    */
#map-svg circle.n13 { fill: #8b5cf6; }  /* light violet   */
#map-svg circle.n14 { fill: #86198f; }  /* plum           */
#map-svg circle.n15 { fill: #c026d3; }  /* fuchsia        */
#map-svg circle.n16 { fill: #be185d; }  /* magenta        */
#map-svg circle.n17 { fill: #f472b6; }  /* pink           */
#map-svg circle.n18 { fill: #64748b; }  /* slate          */
#map-svg circle.n19 { fill: #334155; }  /* dark slate     */

/* ---------- legend column ----------
   36% of the stage width. The descriptions are long ("SQEAL (South Queensland
   Eastern Australia Linkage, part of WOMBAT)") and a narrower column
   ellipsised most of them; this is the widest the legend can go before the
   map stops reading as the subject of the page. */
.legend-col {
    width: calc(var(--u) * 36);
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    min-height: 0;
    /* Hidden, never scrolled: fitLegend() trims rows until the column fits,
       so an overflow here is a bug, not a scrollbar. */
    overflow: hidden;
}
.legend-col h2 {
    font-size: calc(var(--u) * 1.45);
    line-height: 1.2;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    font-weight: 600;
    margin-bottom: calc(var(--u) * 0.45);
    flex-shrink: 0;
}
#legend-rows { flex-shrink: 0; }

.lg-row {
    display: flex;
    align-items: center;
    gap: calc(var(--u) * 0.38);
    width: 100%;
    padding: calc(var(--u) * 0.16) calc(var(--u) * 0.26);
    border: none;
    border-radius: calc(var(--u) * 0.22);
    background: none;
    font-family: var(--sans);
    font-size: calc(var(--u) * 1.75);
    line-height: 1.25;
    text-align: left;
    cursor: pointer;
    color: var(--text);
}
.lg-row:hover { background: var(--bg-muted); }
.lg-row.sel { background: var(--accent-bg); box-shadow: inset 0 0 0 1px var(--accent-soft); }
.lg-row.muted { cursor: default; margin-top: calc(var(--u) * 0.25); }
.lg-row.muted:hover { background: none; }
.lg-swatch {
    width: calc(var(--u) * 1.05);
    height: calc(var(--u) * 1.05);
    border-radius: 50%;
    flex-shrink: 0;
    opacity: 0.85;
}
.lg-swatch.none { background: var(--text-muted); opacity: 0.4; }
/* holds "1H" or, where FDSN reused the code, "1H · 2024". The min-width keeps
   the description column aligned down the list; it is sized to the widest
   form so no row pushes its neighbours out of line. */
.lg-code {
    font-family: var(--mono);
    font-weight: 600;
    font-size: calc(var(--u) * 1.6);
    /* Sized to the widest form ("WG · 2022") — measured, not guessed. A
       narrower value lets that row bleed into the description column and the
       list stops aligning. */
    min-width: calc(var(--u) * 8.0);
    white-space: nowrap;
    flex-shrink: 0;
}
.lg-code .lg-year { color: var(--text-muted); font-weight: 500; }
/* Single-line with an ellipsis, sized so only the three genuinely long
   descriptions truncate — measured: the fourth-longest has ~6% headroom, so
   this is as large as the type can go without ellipsising another row. The
   full text is on the row's title attribute. */
.lg-name {
    color: var(--text-soft);
    flex: 1;
    min-width: 0;
    font-size: calc(var(--u) * 1.62);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.lg-count {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    font-size: calc(var(--u) * 1.62);
    flex-shrink: 0;
    min-width: calc(var(--u) * 3.4);
    text-align: right;
}

.legend-foot {
    margin-top: auto;             /* pinned to the bottom of the column */
    flex-shrink: 0;
    padding-top: calc(var(--u) * 0.55);
}
.legend-note {
    font-size: calc(var(--u) * 1.4);
    line-height: 1.5;
    color: var(--text-soft);
    border-top: 1px solid var(--border);
    padding-top: calc(var(--u) * 0.6);
}
.legend-note strong { color: var(--text); font-weight: 600; }

/* ---------- shared tooltip ---------- */
#map-tip {
    position: fixed;
    display: none;
    background: #0f172a;
    color: #f1f5f9;
    font-size: calc(var(--u) * 1.8);
    padding: calc(var(--u) * 0.35) calc(var(--u) * 0.55);
    border-radius: calc(var(--u) * 0.2);
    pointer-events: none;
    z-index: 90;
    max-width: calc(var(--u) * 42);
    line-height: 1.45;
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.28);
}
</style>
</head>
<body>

<div class="stage">

    <!-- ========== TITLE STRIP ========== -->
    <div class="title-strip">
        <div>
            <h1><span class="accent">AusPass</span> Seismic Network</h1>
        </div>
        <div class="counts">
            <div class="primary" id="count-primary">&mdash;</div>
        </div>
    </div>

    <!-- ========== MAP + LEGEND ========== -->
    <div class="frame">
        <div class="map-pane">
            <!-- viewBox is 1000 x 950, which is the aspect of VIEW_BOX below,
                 not the pane's: 41.05 deg of longitude x cos(26.45 deg) = 36.76
                 against 34.90 deg of latitude = 1.053. At the original 1000 x
                 808 the drawn box was height-limited and left 77 dead units
                 down each side, and that near-square drawing was then
                 letterboxed again inside the pane. Matching the viewBox to the
                 window actually drawn means the projection fills it edge to
                 edge and only the pane's own aspect can waste anything.
                 Keep MAP_W / MAP_H below in sync with VIEW_BOX. -->
            <svg id="map-svg" viewBox="0 0 1000 950" role="img" aria-labelledby="map-svg-title map-svg-desc">
                <title id="map-svg-title">Map of AusPass seismic stations in Australia</title>
                <desc id="map-svg-desc">Loading station positions.</desc>

                <g id="map-coast"></g>

                <!-- Quiet provenance marks, anchored in viewBox units rather
                     than to projected data so they hold their corners at any
                     display size. Aspect ratios are the files' own (281x288
                     and 360x144) and preserveAspectRatio stops any stretch.
                     Both assets are vendored under docs/assets — nothing is
                     hotlinked, so an outage elsewhere cannot break the map.
                     Drawn BEFORE the dots on purpose: as an underlay a mark
                     can never hide a station, whatever the data does next.
                     Each carries a <title>, so a missing file degrades to
                     that text rather than a broken-image glyph. -->
                <g id="map-brand">
                    <image href="assets/auscope-logo.png" x="884" y="20" width="92" height="94" preserveAspectRatio="xMidYMid meet"><title>AuScope</title></image>
                    <!-- The AusPass mark sits over open ocean southwest of WA,
                         so a panel behind it costs no station visibility and
                         stops the wordmark dissolving into the coastline fill.
                         Still an underlay, so a dot always wins. -->
                    <rect id="brand-plate" x="10" y="836" width="225" height="102" rx="10"/>
                    <image href="assets/auspass-logo.png" x="20" y="846" width="205" height="82" preserveAspectRatio="xMidYMid meet"><title>AusPass</title></image>
                </g>

                <g id="map-dots"></g>

                <!-- Locator inset, drawn only when the zoom is tight enough to lose
                     the coastline. Empty at national scale. -->
                <g id="map-inset"></g>
            </svg>
            <div id="map-status">Loading station coordinates from AusPass&hellip;</div>
        </div>

        <div class="legend-col" id="legend-col">
            <h2>Deployments</h2>
            <div id="legend-rows"></div>
            <!-- No navigation, no outbound link: this is a display artefact for
                 embedding, and a hyperlink is dead weight there. The logos
                 already carry the provenance. -->
            <div class="legend-foot">
                <div class="legend-note" id="legend-note"></div>
            </div>
        </div>
    </div>
</div>

<div id="map-tip"></div>

<script>
"use strict";

// ============================================================
// ESCAPING
// ============================================================
// Duplicated from tracker-chassis.js on purpose — this page is a standalone
// artefact and must not depend on a sibling script. SiteName and network
// Description are free text from the FDSN service, so everything
// interpolated goes through one of these.
function escapeHtml(s) {
    if (s == null) return '';
    return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function escapeAttr(s) {
    if (s == null) return '';
    return String(s)
        .replace(/&/g, '&amp;')
        .replace(/'/g, '&#39;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
}

function fmtNum(n) { return (n == null ? 0 : n).toLocaleString(); }

// ============================================================
// CONFIG
// ============================================================
var STATION_URL = 'https://auspass.edu.au/fdsnws/station/1/query?level=station&format=text';
var NETWORK_URL = 'https://auspass.edu.au/fdsnws/station/1/query?level=network&format=text';
var OUTLINE_URL = 'australia-outline.json';

var MAP_W = 1000, MAP_H = 950;   // must match the viewBox on #map-svg
var MAP_PAD = 6;                 // viewBox units of breathing room on all sides

// The domestic window shared with auspass.html / ausis.html / nvcl.html, and
// also the "is this station in Australia?" test. Deliberately generous: the
// westernmost station AusPass serves sits at exactly 113.00 E, so a tighter
// bound here would sit right on top of real data.
var AU_BOX = { minLat: -44, maxLat: -9, minLng: 112, maxLng: 154 };

// What the map is DRAWN to, which is a different question from what counts as
// Australian. AU_BOX carries 1.15 deg of empty ocean west of Steep Point
// (113.15 E) against 0.4 deg east of Cape Byron, so drawing to it left a gap
// down the western edge more than twice the eastern one. This window hugs the
// real extent of the coastline AND the stations — note maxLat stays at -9.0
// rather than following the land, because the Torres Strait rows sit north of
// Cape York. Its aspect IS the viewBox aspect; change one, change the other.
var VIEW_BOX = { minLat: -43.9, maxLat: -9.0, minLng: 112.85, maxLng: 153.9 };

// Dot radius in viewBox units. At the 1145px embed size the map pane is about
// 675px wide for 1000 units, so this renders at roughly 2.2px — matched by eye
// to the density of the nodal arrays, which blob together if the dots grow.
var DOT_R = 3.3;

var LEGEND_MAX = 20;   // starting row budget; fitLegend() trims if it must

// Keep in sync with the #map-svg circle.n0..n19 rules in the <style> block.
var NET_PALETTE = [
    '#282572', '#4338ca', '#2563eb', '#60a5fa',
    '#155e75', '#0891b2', '#0d9488', '#065f46',
    '#166534', '#16a34a', '#4d7c0f', '#84cc16',
    '#5b21b6', '#8b5cf6', '#86198f', '#c026d3',
    '#be185d', '#f472b6', '#64748b', '#334155'
];

// ============================================================
// STATE
// ============================================================
var state = {
    networks: [],        // deployments from level=network
    stations: [],        // all parsed level=station rows (null island dropped)
    shown: [],           // stations inside AU_BOX — the tooltip index
    outline: null,
    colourIdx: {},       // deployment key -> palette slot
    legendKeys: [],      // deployment keys with a legend row, in row order
    netFilter: '',       // isolated deployment key, '' = show all
    legendMax: LEGEND_MAX,
    nullIsland: 0,
    unmatched: 0
};

// ============================================================
// PROJECTION
// ============================================================
// Equirectangular with a standard parallel at the mid-latitude, so a degree of
// longitude is compressed by cos(midLat) and ground distance reads the same on
// both axes. ONE scale factor drives both axes — nothing is ever stretched.
// Raw degrees would draw Australia about 34% too wide.
//
// The AU box is fitted to the frame with padding and centred; whichever axis
// runs out first sets the scale.
function mainProjection() {
    return projectionFor(activeBox());
}

// The window currently on screen: the whole country, or the extent of the one
// selected deployment. Isolating a 24-station array only to draw it at
// continental scale wastes the isolation — the point of picking one out is to
// look at it.
function activeBox() {
    if (!state.netFilter) return VIEW_BOX;
    var lo = Infinity, hi = -Infinity, la = Infinity, lb = -Infinity, i, s, n = 0;
    for (i = 0; i < state.shown.length; i++) {
        s = state.shown[i];
        if (s.depKey !== state.netFilter) continue;
        n++;
        if (s.lng < lo) lo = s.lng;
        if (s.lng > hi) hi = s.lng;
        if (s.lat < la) la = s.lat;
        if (s.lat > lb) lb = s.lat;
    }
    if (!n) return VIEW_BOX;
    // Only a floor against degenerate geometry — a one-station deployment has
    // no extent and would divide by ~0. It is deliberately TINY, because the
    // deployments vary by two orders of magnitude: WA Array spans 10.3 deg
    // while Vulcan spans 0.08 (about 9 km). Any floor generous enough to keep
    // coastline in frame for an inland array would render Vulcan as a single
    // speck, which defeats the point of isolating it. Inland arrays do lose
    // the coast at this zoom; that is the cost of actually seeing the array,
    // and the deployment name in the legend carries the "where".
    var MIN_SPAN = 0.15;                                  // degrees of latitude
    // Proportional padding with a hair of a floor. An earlier version floored
    // this at 0.25 deg PER SIDE, which is fine for a continental array and
    // catastrophic for a compact one: Mundi Mundi spans 0.21 deg, so a flat
    // 0.25 either side produced a 0.71 deg frame and drew the array at a
    // third of the size it should have been.
    var padLat = Math.max((lb - la) * 0.12, 0.01);
    var padLng = Math.max((hi - lo) * 0.12, 0.01);
    la -= padLat; lb += padLat; lo -= padLng; hi += padLng;
    if (lb - la < MIN_SPAN) { var cLat = (la + lb) / 2; la = cLat - MIN_SPAN / 2; lb = cLat + MIN_SPAN / 2; }
    if (hi - lo < MIN_SPAN) { var cLng = (lo + hi) / 2; lo = cLng - MIN_SPAN / 2; hi = cLng + MIN_SPAN / 2; }
    return { minLat: la, maxLat: lb, minLng: lo, maxLng: hi };
}

function projectionFor(BOX) {
    var dLat = BOX.maxLat - BOX.minLat;
    var dLng = BOX.maxLng - BOX.minLng;
    var cosMid = Math.cos(((BOX.minLat + BOX.maxLat) / 2) * Math.PI / 180);
    var availW = MAP_W - 2 * MAP_PAD;
    var availH = MAP_H - 2 * MAP_PAD;
    var k = Math.min(availW / (dLng * cosMid), availH / dLat);  // units per degree of latitude
    var w = dLng * cosMid * k, h = dLat * k;
    var ox = (MAP_W - w) / 2, oy = (MAP_H - h) / 2;
    return {
        x: function(lng) { return ox + (lng - BOX.minLng) * cosMid * k; },
        y: function(lat) { return oy + (BOX.maxLat - lat) * k; }
    };
}

function inBox(s, box) {
    return s.lat >= box.minLat && s.lat <= box.maxLat
        && s.lng >= box.minLng && s.lng <= box.maxLng;
}

// ============================================================
// DEPLOYMENT IDENTITY
// ============================================================
// A network CODE is not an identity. FDSN reuses codes for sequential
// experiments: 1H covers both a 2010 deployment and the 2024 Mundi Mundi
// array, 1G covers three (2008, 2019, 2020), and even WG — the biggest entry
// on this map — is two (2022 and 2024); 2B and 7M are reused as well. Keying
// the map on the bare code merges them, so "isolate Mundi Mundi" silently
// lights up two unrelated experiments.
//
// The identity used here is code + '|' + startTime, matching auspass.html's
// rowKey. Station rows carry each STATION's own start/end, not the network's,
// so a station is matched to the deployment whose operating period contains
// its start date. Deployments are searched newest-first, so where periods
// overlap the latest-starting (most specific) match wins. Anything unmatched
// falls back to the bare code and is counted and disclosed.
function buildDeploymentIndex(networks) {
    var byCode = {}, i;
    for (i = 0; i < networks.length; i++) {
        var n = networks[i];
        if (!byCode[n.code]) byCode[n.code] = [];
        byCode[n.code].push(n);
    }
    Object.keys(byCode).forEach(function(code) {
        byCode[code].sort(function(a, b) {
            return (b.startTime || '').localeCompare(a.startTime || '');
        });
    });
    return byCode;
}

// Tags every station in place. Returns the number with no resolvable deployment.
function assignDeployments(stations, byCode) {
    var unmatched = 0;
    for (var i = 0; i < stations.length; i++) {
        var s = stations[i];
        var candidates = byCode[s.net] || [];
        var hit = null;
        for (var j = 0; j < candidates.length; j++) {
            var n = candidates[j];
            if (!n.startTime) continue;
            // FDSN timestamps are fixed-field ISO, so a string compare is a
            // correct chronological compare (and tolerates the fractional
            // seconds some rows carry).
            if (s.start < n.startTime) continue;
            if (n.endTime && s.start > n.endTime) continue;
            hit = n;
            break;
        }
        // Every row carries its start year. An earlier version showed it only
        // where FDSN had reused a code, on the reasoning that "WG · 2022" is
        // noise on a code used once — but at embed size the year is the fastest
        // way to place a deployment in time, and a column where most rows are
        // blank reads as missing data rather than as deliberate economy.
        if (hit) {
            s.depKey = hit.rowKey;
            s.depCode = hit.code;
            s.depYear = hit.startYear || '';
            s.depDesc = hit.description || '';
        } else {
            s.depKey = s.net + '|';
            s.depCode = s.net;
            s.depYear = '';
            s.depDesc = candidates.length === 1 ? (candidates[0].description || '') : '';
            unmatched++;
        }
    }
    return unmatched;
}

// ============================================================
// COLOUR ASSIGNMENT
// ============================================================
// djb2-ish hash so a deployment always lands on the same palette slot,
// whatever order the rows arrive in.
function netHash(code) {
    var h = 0;
    for (var i = 0; i < code.length; i++) {
        h = ((h << 5) - h + code.charCodeAt(i)) | 0;
    }
    return Math.abs(h) % NET_PALETTE.length;
}

// 73 deployments over 20 colours means the palette repeats — unavoidable, and
// fine for the map, where colour is a grouping aid rather than a key. The
// LEGEND is the part that must not collide: with 20 slots hashed independently
// the named deployments would collide with near-certainty. So the legend's
// deployments are walked in row order and bumped to the next free slot;
// everything below the legend keeps its pure hash colour.
//
// Collisions are resolved against exactly the rows the legend will draw, so
// the swatch a row shows is always the colour its dots were drawn with.
function buildNetColours(allStations, legendKeys) {
    var idx = {}, i, key;
    for (i = 0; i < allStations.length; i++) {
        key = allStations[i].depKey;
        if (idx[key] === undefined) idx[key] = netHash(key);
    }
    var used = {};
    for (i = 0; i < legendKeys.length && i < NET_PALETTE.length; i++) {
        var slot = idx[legendKeys[i]], tries = 0;
        while (used[slot] && tries < NET_PALETTE.length) {
            slot = (slot + 1) % NET_PALETTE.length;
            tries++;
        }
        used[slot] = true;
        idx[legendKeys[i]] = slot;
    }
    return idx;
}

// Station count descending, key ascending on ties — deterministic.
function rankNetworks(counts) {
    return Object.keys(counts).sort(function(a, b) {
        if (counts[b] !== counts[a]) return counts[b] - counts[a];
        return a < b ? -1 : 1;
    });
}

// ============================================================
// LOAD
// ============================================================
function load() {
    var statusEl = document.getElementById('map-status');
    Promise.all([
        fetch(STATION_URL).then(function(r) {
            if (!r.ok) throw new Error('station service returned HTTP ' + r.status);
            return r.text();
        }),
        fetch(NETWORK_URL).then(function(r) {
            if (!r.ok) throw new Error('network service returned HTTP ' + r.status);
            return r.text();
        }),
        // Outline failure is not fatal — the dots carry the geography.
        fetch(OUTLINE_URL).then(function(r) {
            return r.ok ? r.json() : null;
        }).catch(function() { return null; })
    ]).then(function(res) {
        state.stations = parseStations(res[0]);
        state.networks = parseNetworks(res[1]);
        state.outline = res[2];
        if (state.stations.length === 0) throw new Error('no station rows returned');
        statusEl.hidden = true;
        bindEvents();
        render();
        // The legend is sized in --u, so it fits by construction; this is the
        // belt-and-braces pass in case a description or locale widens a row.
        fitLegend();
    }).catch(function(err) {
        statusEl.hidden = false;
        statusEl.className = 'error';
        statusEl.textContent = 'Could not draw the map: '
            + (err && err.message ? err.message : 'fetch failed');
    });
}

// Pipe-delimited FDSN text: Network|Station|Lat|Lon|Elev|SiteName|Start|End.
// Comment lines start with '#' (the header is one of them).
//
// One row is dropped: the service carries a null-island sentinel
// (XX|ABCD|0.0|0.0|...|Nowhere) that is not a real station. It is dropped by
// coordinate, not by network code, and the count is disclosed under the legend
// rather than quietly swallowed.
function parseStations(text) {
    var lines = String(text).split('\n');
    var out = [], now = Date.now();
    state.nullIsland = 0;
    for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        if (!line || line.charAt(0) === '#') continue;
        var p = line.split('|');
        if (p.length < 8) continue;
        var lat = parseFloat(p[2]), lng = parseFloat(p[3]);
        if (isNaN(lat) || isNaN(lng)) continue;
        if (lat === 0 && lng === 0) { state.nullIsland++; continue; }
        var end = p[7].trim();
        var endTs = end ? new Date(end).getTime() : NaN;
        out.push({
            net: p[0].trim(),
            sta: p[1].trim(),
            lat: lat,
            lng: lng,
            site: p[5].trim(),
            start: p[6].trim(),                       // matched by assignDeployments
            startYear: p[6].trim().substring(0, 4),
            endYear: end ? end.substring(0, 4) : '',
            active: !end || (!isNaN(endTs) && endTs > now),
            depKey: '', depCode: '', depYear: '', depDesc: ''
        });
    }
    return out;
}

// Pipe-delimited: Network|Description|StartTime|EndTime|TotalStations.
function parseNetworks(text) {
    var lines = String(text).split('\n');
    var out = [];
    for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        if (!line || line.charAt(0) === '#') continue;
        var p = line.split('|');
        if (p.length < 5) continue;
        var code = p[0].trim(), startTime = p[2].trim();
        out.push({
            code: code,
            description: p[1].trim(),
            startTime: startTime,
            endTime: p[3].trim(),
            startYear: startTime.substring(0, 4),
            rowKey: code + '|' + startTime
        });
    }
    return out;
}

// ============================================================
// RENDER
// ============================================================
function render() {
    state.unmatched = assignDeployments(state.stations, buildDeploymentIndex(state.networks));

    state.shown = state.stations.filter(function(s) { return inBox(s, AU_BOX); });

    state.legendKeys = computeLegendKeys();
    state.colourIdx = buildNetColours(state.stations, state.legendKeys);

    var box = activeBox();
    var proj = projectionFor(box);
    drawCoast(proj);
    drawDots(proj);
    drawInset(box);
    renderLegend();
    renderCounts();
    renderNotes();
}

// Top N deployments by station count.
function computeLegendKeys() {
    var counts = {}, i;
    for (i = 0; i < state.shown.length; i++) {
        counts[state.shown[i].depKey] = (counts[state.shown[i].depKey] || 0) + 1;
    }
    return rankNetworks(counts).slice(0, state.legendMax);
}

// Maps VIEW_BOX into an arbitrary rect, so the same rings can be drawn twice
// at two scales without the main projection knowing anything about it.
function insetProjection(bx, by, bw, bh) {
    var dLat = VIEW_BOX.maxLat - VIEW_BOX.minLat;
    var dLng = VIEW_BOX.maxLng - VIEW_BOX.minLng;
    var cosMid = Math.cos(((VIEW_BOX.minLat + VIEW_BOX.maxLat) / 2) * Math.PI / 180);
    var k = Math.min(bw / (dLng * cosMid), bh / dLat);
    var w = dLng * cosMid * k, h = dLat * k;
    var ox = bx + (bw - w) / 2, oy = by + (bh - h) / 2;
    return {
        x: function(lng) { return ox + (lng - VIEW_BOX.minLng) * cosMid * k; },
        y: function(lat) { return oy + (VIEW_BOX.maxLat - lat) * k; }
    };
}

// Shown only below this span — above it enough of the continent is already on
// screen that a second, smaller copy of it would just be clutter.
var INSET_MAX_SPAN = 6;        // degrees of latitude

function drawInset(box) {
    var g = document.getElementById('map-inset');
    if (!state.netFilter || (box.maxLat - box.minLat) >= INSET_MAX_SPAN) {
        g.innerHTML = '';
        return;
    }
    var IW = 210, IH = 196, PAD = 8;
    var bx = MAP_W - IW - 18, by = MAP_H - IH - 18;
    var proj = insetProjection(bx + PAD, by + PAD, IW - 2 * PAD, IH - 2 * PAD);
    var rings = (state.outline && state.outline.rings) || [];
    var parts = ['<rect class="in-plate" x="' + bx + '" y="' + by + '" width="' + IW
        + '" height="' + IH + '" rx="8"/>'];
    for (var r = 0; r < rings.length; r++) {
        var ring = rings[r], d = '', i;
        for (i = 0; i < ring.length; i++) {
            d += (i ? 'L' : 'M') + proj.x(ring[i][0]).toFixed(1) + ' ' + proj.y(ring[i][1]).toFixed(1);
        }
        if (d) parts.push('<path class="in-coast" d="' + d + 'Z"/>');
    }
    var cLat = (box.minLat + box.maxLat) / 2, cLng = (box.minLng + box.maxLng) / 2;
    var mx = proj.x(cLng), my = proj.y(cLat);
    parts.push('<circle class="in-ring" cx="' + mx.toFixed(1) + '" cy="' + my.toFixed(1) + '" r="11"/>');
    parts.push('<circle class="in-mark" cx="' + mx.toFixed(1) + '" cy="' + my.toFixed(1) + '" r="4.6"/>');
    g.innerHTML = parts.join('');
}

function drawCoast(proj) {
    var rings = (state.outline && state.outline.rings) || [];
    var parts = [];
    for (var r = 0; r < rings.length; r++) {
        var ring = rings[r], d = '';
        for (var i = 0; i < ring.length; i++) {
            d += (i === 0 ? 'M' : 'L') + proj.x(ring[i][0]).toFixed(1) + ',' + proj.y(ring[i][1]).toFixed(1);
        }
        parts.push('<path d="' + d + 'Z"/>');
    }
    document.getElementById('map-coast').innerHTML = parts.join('');
}

// One string, one innerHTML assignment — 3,311 individually created elements
// would cost far more than the string build.
function drawDots(proj) {
    var list = state.shown, parts = [];
    for (var i = 0; i < list.length; i++) {
        var s = list[i];
        var cls = 'stn n' + (state.colourIdx[s.depKey] || 0);
        if (state.netFilter && s.depKey !== state.netFilter) cls += ' dim';
        parts.push('<circle class="' + cls + '" cx="' + proj.x(s.lng).toFixed(1)
            + '" cy="' + proj.y(s.lat).toFixed(1) + '" r="' + DOT_R + '" data-i="' + i + '"/>');
    }
    document.getElementById('map-dots').innerHTML = parts.join('');
}

// "1H 2024" — code then start year, which every row now carries.
function depLabel(sample, key) {
    if (sample) return sample.depCode + (sample.depYear ? ' ' + sample.depYear : '');
    return String(key || '').split('|')[0];
}

function renderLegend() {
    var i, counts = {}, sample = {};
    for (i = 0; i < state.shown.length; i++) {
        var st = state.shown[i];
        counts[st.depKey] = (counts[st.depKey] || 0) + 1;
        if (!sample[st.depKey]) sample[st.depKey] = st;     // carries label + description
    }

    var keys = state.legendKeys;
    var html = '';
    for (i = 0; i < keys.length; i++) {
        var key = keys[i];
        var s = sample[key];
        if (!s) continue;
        var n = counts[key] || 0;
        var desc = s.depDesc;
        var label = depLabel(s, key);
        var sel = state.netFilter === key ? ' sel' : '';
        html += '<button type="button" class="lg-row' + sel + '" data-dep="' + escapeAttr(key) + '"'
            + ' aria-pressed="' + (state.netFilter === key ? 'true' : 'false') + '"'
            + ' title="' + escapeAttr(label + (desc ? ' — ' + desc : '')) + '">'
            + '<span class="lg-swatch" style="background:' + escapeAttr(NET_PALETTE[state.colourIdx[key] || 0]) + '"></span>'
            + '<span class="lg-code">' + escapeHtml(s.depCode)
                + (s.depYear ? ' <span class="lg-year">' + escapeHtml(s.depYear) + '</span>' : '')
            + '</span>'
            + '<span class="lg-name">' + escapeHtml(desc || '(no description)') + '</span>'
            + '<span class="lg-count">' + fmtNum(n) + '</span>'
            + '</button>';
    }

    var shownKeys = {};
    for (i = 0; i < keys.length; i++) shownKeys[keys[i]] = true;
    var restKeys = Object.keys(counts).filter(function(k) { return !shownKeys[k]; });
    if (restKeys.length > 0) {
        var restStations = 0;
        for (i = 0; i < restKeys.length; i++) restStations += counts[restKeys[i]];
        html += '<div class="lg-row muted">'
            + '<span class="lg-swatch none"></span>'
            + '<span class="lg-name">' + fmtNum(restKeys.length) + ' other deployments</span>'
            + '<span class="lg-count">' + fmtNum(restStations) + '</span>'
            + '</div>';
    }
    document.getElementById('legend-rows').innerHTML = html;
}

function renderCounts() {
    var i, deps = {};
    for (i = 0; i < state.shown.length; i++) {
        deps[state.shown[i].depKey] = true;
    }
    var nDeps = Object.keys(deps).length;
    var primary = document.getElementById('count-primary');

    if (state.netFilter) {
        var only = state.shown.filter(function(s) { return s.depKey === state.netFilter; }).length;
        primary.textContent = fmtNum(only) + ' of ' + fmtNum(state.shown.length) + ' stations';
    } else {
        primary.textContent = fmtNum(state.shown.length) + ' stations · '
            + fmtNum(nDeps) + ' deployment' + (nDeps === 1 ? '' : 's');
    }

    document.getElementById('map-svg-desc').textContent =
        'Dot map of ' + fmtNum(state.shown.length) + ' AusPass seismic stations across Australia, '
        + 'plotted at their registered coordinates and coloured by deployment over an outline of '
        + 'the continent.';
}

// Offshore disclosure + the housekeeping caveats, in the legend column (there
// is no view toggle on this page to switch to, so the note states the number
// rather than offering a mode).
function renderNotes() {
    var i, outside = 0, outsideNets = {};
    for (i = 0; i < state.stations.length; i++) {
        if (inBox(state.stations[i], AU_BOX)) continue;
        outside++;
        outsideNets[state.stations[i].net] = true;
    }
    var nNets = Object.keys(outsideNets).length;

    var html;
    if (outside === 0) {
        html = 'Every station AusPass serves is drawn here.';
    } else {
        html = '<strong>' + fmtNum(outside) + ' station' + (outside === 1 ? '' : 's')
            + ' in ' + fmtNum(nNets) + ' network' + (nNets === 1 ? '' : 's')
            + '</strong> are deployed outside Australia and are not shown.';
    }
    // Only surfaced when it actually happens — currently zero, but a registry
    // change could break it, and a silently mis-grouped station is the failure
    // the deployment keying exists to prevent.
    if (state.unmatched > 0) {
        html += ' <strong>' + fmtNum(state.unmatched) + ' station'
            + (state.unmatched === 1 ? '' : 's') + ' could not be matched to a deployment</strong> '
            + 'and ' + (state.unmatched === 1 ? 'is' : 'are') + ' grouped under the bare network code.';
    }
    document.getElementById('legend-note').innerHTML = html;
}

// The layout is a pure scale of --u, so 20 rows fit by construction at every
// resolution. This is the guard against the one thing --u cannot control: a
// description or number that renders taller than expected. Rows are dropped
// (and the "N other deployments" row absorbs them) rather than a scrollbar
// appearing.
function fitLegend() {
    var col = document.getElementById('legend-col');
    var foot = col.querySelector('.legend-foot');
    // Measured on the rects rather than scrollHeight/clientHeight: those round
    // to whole pixels and a fractional column height reports a phantom 1px
    // overflow, which would cost a real legend row for nothing.
    var overflows = function() {
        return foot.getBoundingClientRect().bottom - col.getBoundingClientRect().bottom > 0.5;
    };
    var guard = 0;
    while (overflows() && state.legendMax > 6 && guard < 20) {
        state.legendMax--;
        state.legendKeys = computeLegendKeys();
        state.colourIdx = buildNetColours(state.stations, state.legendKeys);
        renderLegend();
        renderNotes();
        guard++;
    }
    // Colours may have shifted if rows were dropped; keep dots and swatches
    // in step.
    if (guard > 0) drawDots(mainProjection());
}

// ============================================================
// EVENTS — all delegated, bound once, no inline handlers
// ============================================================
function bindEvents() {
    document.getElementById('legend-rows').addEventListener('click', function(e) {
        var row = e.target.closest('button.lg-row');
        if (!row) return;
        var key = row.getAttribute('data-dep');
        state.netFilter = (state.netFilter === key) ? '' : key;
        // The frame changes now, not just the dimming, so the coast has to be
        // redrawn with the same projection or the dots float off it. Ranking
        // and colours are still untouched — only the window moves.
        var box = activeBox();
        var proj = projectionFor(box);
        drawCoast(proj);
        drawDots(proj);
        drawInset(box);
        renderLegend();
        renderCounts();
    });

    var svg = document.getElementById('map-svg');
    svg.addEventListener('mousemove', onMapMove);
    svg.addEventListener('mouseleave', function() {
        document.getElementById('map-tip').style.display = 'none';
    });

    var resizeTimer;
    window.addEventListener('resize', function() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function() {
            state.legendMax = LEGEND_MAX;
            state.legendKeys = computeLegendKeys();
            state.colourIdx = buildNetColours(state.stations, state.legendKeys);
            renderLegend();
            renderNotes();
            drawDots(mainProjection());
            fitLegend();
        }, 150);
    });
}

// One shared tooltip div — 3,311 <title> children would bloat the SVG.
function onMapMove(e) {
    var tip = document.getElementById('map-tip');
    var t = e.target;
    if (!t || t.tagName !== 'circle' || !t.hasAttribute('data-i')) {
        tip.style.display = 'none';
        return;
    }
    var s = state.shown[+t.getAttribute('data-i')];
    if (!s) { tip.style.display = 'none'; return; }

    var years = s.startYear || '?';
    if (s.endYear && s.endYear !== s.startYear) years += '–' + s.endYear;
    else if (s.active) years += '–now';
    // Names the deployment, not just the code — a bare "1H" is ambiguous
    // between the 2010 experiment and the 2024 Mundi Mundi array.
    var txt = (s.site || '(unnamed site)') + ' — ' + s.net + ' ' + s.sta;
    if (s.depDesc) txt += ' · ' + s.depDesc + (s.depYear ? ' (' + s.depYear + ')' : '');
    txt += ' · ' + (s.active ? 'active' : 'concluded') + ' · ' + years;
    // textContent, not innerHTML — SiteName is free text from the service.
    tip.textContent = txt;
    tip.style.display = 'block';

    var w = tip.offsetWidth;
    var x = e.clientX + 14;
    if (x + w > window.innerWidth - 8) x = e.clientX - w - 14;
    if (x < 4) x = 4;
    var y = e.clientY + 14;
    if (y + tip.offsetHeight > window.innerHeight - 8) y = e.clientY - tip.offsetHeight - 14;
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
}

// ============================================================
// GO
// ============================================================
load();
</script>
</body>
</html>
